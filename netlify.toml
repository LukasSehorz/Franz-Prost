# Netlify: Die fertige Seite liegt im Ordner "website", ein Build ist nicht nötig.
[build]
  publish = "website"
  command = ""

# Kalenderdatei Infoabend: als Kalendertermin ausliefern (iPhone öffnet dann „Zum Kalender hinzufügen“)
[[headers]]
  for = "/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"

# Mail-Bausteine fuer HubSpot: duerfen vom HubSpot-Editor geladen werden, nicht in Suchmaschinen
[[headers]]
  for = "/mail/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://app-eu1.hubspot.com"
    X-Robots-Tag = "noindex"

# Kurze Adresse für Stories und Flyer: akademie-besseres-leben.eu/infoabend -> Infoabend-Seite
# (302, damit die Kurzadresse später auf einen anderen Abend zeigen kann; Partner-Kennung ?aff= bleibt erhalten)
[[redirects]]
  from = "/infoabend"
  to = "/heilfasten-2027/infoabend/"
  status = 302
[[redirects]]
  from = "/infoabend/"
  to = "/heilfasten-2027/infoabend/"
  status = 302

# SEO beim Umzug von WordPress: alte Adressen, die es auf der neuen Seite nicht mehr gibt,
# dauerhaft (301) auf die passende Seite umleiten, damit Google nichts verliert.
[[redirects]]
  from = "/wp-sitemap.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/wp-sitemap-*"
  to = "/sitemap.xml"
  status = 301
